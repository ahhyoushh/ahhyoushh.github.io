  <!--
      Runs before the body is parsed so the first paint is already in the right
      colours. Default is light; `latex-dark` is set when the user picks dark.
    -->
  <script>
    (() => {
      const root = document.documentElement;
      let stored = null;
      try { stored = localStorage.getItem('theme'); } catch { }
      root.className = stored === 'dark' ? 'latex-dark' : 'latex-light';
    })();
  </script>
